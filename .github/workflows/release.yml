name: Release

# Tagging v0.x.y on main is the release for both halves of the platform: Go
# consumers fetch the module by tag, and this workflow publishes the Vue kit
# under the same version to the public npm registry as @bboxsys/ui.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@bboxsys'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck and test
        working-directory: ui
        run: npm run typecheck && npm test
      - name: Version from tag
        working-directory: ui
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Publish
        working-directory: ui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
